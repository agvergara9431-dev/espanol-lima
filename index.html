<!doctype html>
<html lang="nl" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Español para Lima</title>
<meta name="description" content="Spaans leren voor de reis naar Lima.">
<meta name="theme-color" content="#e6f3fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1d2a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Español">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="login" hidden></main>
<div id="app" hidden>
  <section id="tab-home"></section>
  <section id="tab-passport" hidden></section>
  <section id="tab-lucia" hidden></section>
  <section id="tab-chat" hidden></section>
  <section id="tab-words" hidden></section>
  <section id="tab-panel" hidden></section>
  <nav class="tabs" id="nav" role="tablist" aria-label="Menu"></nav>
</div>

<div id="week" class="sheet" hidden></div>

<div id="lesson" hidden role="dialog" aria-modal="true" aria-labelledby="lessonTitle">
  <div class="lhead">
    <button id="quitBtn" class="icon-btn" aria-label="Stoppen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="bar"><i id="lbar"></i></div>
    <div class="combo" id="combo"></div>
  </div>
  <div class="ltitle mono" id="lessonTitle"></div>
  <div class="lbody" id="lbody"></div>
  <div class="lfoot" id="lfoot"><div class="inner"><div class="verdict" id="verdict" hidden></div><button class="btn wide" id="checkBtn">Controleren</button></div></div>
</div>

<div id="stampOverlay" class="stamp-overlay" hidden role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
